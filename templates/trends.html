<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingredient Pulse • SkinWise</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --lav-50: #F5F0FF;
            --lav-100: #EDE8FF;
            --lav-200: #D8CCFF;
            --lav-400: #A78BDE;
            --lav-600: #7C5CBF;
            --lav-800: #3D2878;
            --lav-900: #1E1040;
            --cream: #FDFBFF;
            --muted: #8B7AAF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--cream);
            color: var(--lav-900);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .blob {
            position: absolute;
            background: radial-gradient(circle at 40% 40%, #D8CCFF 0%, #EDE8FF 40%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
        }

        .blob1 {
            width: 500px;
            height: 500px;
            top: -120px;
            right: -80px;
        }

        .blob2 {
            width: 420px;
            height: 420px;
            bottom: -100px;
            left: -60px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.4rem;
            text-align: center;
            margin-bottom: 0.5rem;
            color: var(--lav-600);
        }

        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(167, 139, 222, 0.25);
            border-radius: 28px;
            box-shadow: 0 8px 32px rgba(124, 92, 191, 0.08);
            padding: 2.5rem;
            margin-bottom: 2rem;
        }

        .pill {
            padding: 10px 22px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid var(--lav-200);
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all .3s;
            white-space: nowrap;
        }

        .pill:hover {
            background: var(--lav-100);
            border-color: var(--lav-400);
            transform: translateY(-2px);
        }

        .pill.active {
            background: var(--lav-600);
            color: #fff;
            border-color: var(--lav-800);
        }

        #pills {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 10px;
            justify-content: center;
            margin: 1.5rem 0;
        }

        button.go {
            display: block;
            margin: 1.5rem auto 0;
            padding: 18px 48px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 9999px;
            background: linear-gradient(90deg, var(--lav-600), var(--lav-400));
            color: #fff;
            border: none;
            box-shadow: 0 12px 30px rgba(124, 92, 191, 0.4);
            cursor: pointer;
        }

        button.go:disabled {
            opacity: .7;
            cursor: wait;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th,
        td {
            text-align: left;
            padding: 10px 8px;
            border-bottom: 1px solid var(--lav-100);
            font-size: 0.95rem;
        }

        th {
            color: var(--muted);
            font-weight: 500;
        }

        .chip {
            display: inline-block;
            background: var(--lav-100);
            color: var(--lav-800);
            padding: 6px 14px;
            border-radius: 50px;
            margin: 4px 6px 4px 0;
            font-size: 0.9rem;
        }

        .chip b {
            color: #1A8C4E;
            margin-left: 6px;
        }

        .prod {
            width: 300px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 24px;
            padding: 1rem;
            box-shadow: 0 8px 25px rgba(124, 92, 191, 0.1);
        }
    </style>
</head>

<body>
    <nav
        style="position:fixed; top:0; left:0; right:0; background:rgba(253,251,255,0.95); backdrop-filter:blur(16px); border-bottom:1px solid rgba(167,139,222,0.15); padding:1.3rem 3rem; display:flex; align-items:center; justify-content:space-between; z-index:100;">
        <div style="font-family:'Cormorant Garamond',serif; font-size:2.2rem; font-weight:600; color:var(--lav-800);">
            Skin<span style="color:var(--lav-400);">Wise</span></div>
        <div style="display:flex; gap:2rem; font-weight:500;">
            <a href="/" style="text-decoration:none; color:var(--muted);">Home</a>
            <a href="/analyzer" style="text-decoration:none; color:var(--muted);">Analyzer</a>
            <a href="/recommender" style="text-decoration:none; color:var(--muted);">Regimen</a>
            <a href="/ethiscan" style="text-decoration:none; color:var(--muted);">EthiScan</a>
            <a href="/trends" style="text-decoration:none; color:var(--lav-600);">Trends</a>
        </div>
    </nav>
    <div style="height:70px;"></div>
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>

    <div class="container">
        <h1>Ingredient Pulse</h1>
        <p style="text-align:center; color:var(--muted); font-size:1.2rem; margin-bottom:1.5rem;">What India is
            searching for in skincare, live from Google Trends</p>

        <div class="card">
            <label style="font-weight:500; display:block; text-align:center;">Pick 2-5 ingredients to compare (past 12
                months, India)</label>
            <div id="pills"></div>
            <button class="go" id="goBtn">Show the pulse ✨</button>
        </div>

        <div id="results" style="display:none;"></div>
    </div>

    <script>
        const INGREDIENTS = ["niacinamide", "retinol", "vitamin c", "salicylic acid", "hyaluronic acid", "ceramide",
            "glycolic acid", "azelaic acid", "peptides", "bakuchiol", "tranexamic acid", "centella asiatica"];
        const COLORS = ['#7C5CBF', '#E07BA0', '#2FA37A', '#E0A33A', '#4A8FE0'];
        let selected = INGREDIENTS.slice(0, 5);

        const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        function renderPills() {
            const box = document.getElementById('pills');
            box.innerHTML = '';
            INGREDIENTS.forEach(name => {
                const p = document.createElement('div');
                p.className = 'pill' + (selected.includes(name) ? ' active' : '');
                p.textContent = name.charAt(0).toUpperCase() + name.slice(1);
                p.addEventListener('click', () => {
                    if (selected.includes(name)) selected = selected.filter(x => x !== name);
                    else if (selected.length < 5) selected.push(name);
                    renderPills();
                });
                box.appendChild(p);
            });
        }

        function drawChart(series, names) {
            const W = 900, H = 320, L = 40, R = 10, T = 10, B = 32;
            const n = series.length;
            const x = i => L + (W - L - R) * i / ((n - 1) || 1);
            const y = v => T + (H - T - B) * (1 - v / 100);
            let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;">`;
            [0, 25, 50, 75, 100].forEach(g => {
                svg += `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" stroke="#EDE8FF"/>` +
                    `<text x="${L - 6}" y="${y(g) + 4}" font-size="11" fill="#8B7AAF" text-anchor="end">${g}</text>`;
            });
            names.forEach((nm, k) => {
                const pts = series.map((p, i) => `${x(i).toFixed(1)},${y(p.values[k]).toFixed(1)}`).join(' ');
                svg += `<polyline fill="none" stroke="${COLORS[k]}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${pts}"/>`;
            });
            const step = Math.max(1, Math.round(n / 6));
            series.forEach((p, i) => {
                if (i % step !== 0) return;
                const month = (p.date.split('–')[0].trim().split(' ')[0]) || '';
                const year = (p.date.match(/\d{4}/) || [''])[0].slice(2);
                svg += `<text x="${x(i)}" y="${H - 10}" font-size="11" fill="#8B7AAF" text-anchor="middle">${esc(month)} '${esc(year)}</text>`;
            });
            return svg + '</svg>';
        }

        function render(d) {
            const names = d.ingredients;
            const legend = names.map((n, k) =>
                `<span style="display:inline-flex; align-items:center; gap:6px; margin:0 14px 6px 0; font-size:0.95rem;">
                <span style="width:14px; height:14px; border-radius:50%; background:${COLORS[k]};"></span>${esc(n)}</span>`).join('');

            const rows = d.stats.slice().sort((a, b) => b.avg - a.avg).map(s => {
                const k = names.indexOf(s.name);
                const m = s.momentum;
                const mTxt = m == null ? '–' : (m >= 0 ? `↑ +${m}%` : `↓ ${m}%`);
                const mCol = m == null ? '#888' : (m >= 0 ? '#1A8C4E' : '#D32F2F');
                return `<tr><td><span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:${COLORS[k]}; margin-right:8px;"></span>${esc(s.name)}</td>
                    <td>${s.avg}/100</td><td style="color:${mCol}; font-weight:600;">${mTxt}</td></tr>`;
            }).join('');

            const chips = (arr) => arr.length ? arr.map(r => `<span class="chip">${esc(r.query)}<b>${esc(r.value)}</b></span>`).join('') : '<span style="color:#888;">No data</span>';

            const prods = (d.products || []).map(p => `
        <div class="prod">
            ${p.thumbnail ? `<img src="${esc(p.thumbnail)}" style="width:100%; height:140px; object-fit:contain; border-radius:14px; background:#fff;">` : ''}
            <h4 style="margin:8px 0 4px; font-size:0.95rem; text-align:center;">${esc(p.title)}</h4>
            <p style="text-align:center; color:#666; font-size:0.85rem;">${esc(p.merchant)}${p.rating ? ` • ⭐ ${esc(p.rating)}` : ''}</p>
            <p style="text-align:center; font-weight:600; margin:6px 0;">${esc(p.price)}</p>
            <a href="${esc(p.link)}" target="_blank" rel="noopener" style="display:block; text-align:center; color:var(--lav-600); text-decoration:none; font-weight:600;">View →</a>
        </div>`).join('');

            document.getElementById('results').innerHTML = `
        <div class="card">
            <h2 style="text-align:center; margin-bottom:1rem;">Search interest over time</h2>
            <div style="text-align:center;">${legend}</div>
            ${drawChart(d.series, names)}
            <table><tr><th>Ingredient</th><th>Average interest</th><th>Momentum (last ~2 months vs first)</th></tr>${rows}</table>
        </div>
        <div class="card">
            <h2 style="text-align:center; margin-bottom:0.3rem;">🔥 Trend to watch: ${esc(d.focus)}</h2>
            <p style="text-align:center; color:var(--muted); margin-bottom:1.5rem;">The fastest-rising ingredient in your comparison</p>
            <h4 style="margin:0.5rem 0;">Rising searches</h4>${chips(d.rising)}
            <h4 style="margin:1.2rem 0 0.5rem;">Top searches</h4>${chips(d.top)}
            ${prods ? `<h4 style="margin:1.8rem 0 1rem;">Shop the trend (live from Google Shopping)</h4>
                    <div style="display:flex; gap:1.5rem; flex-wrap:wrap; justify-content:center;">${prods}</div>` : ''}
        </div>
        <p style="text-align:center; font-size:0.8rem; color:var(--muted); margin-bottom:2rem;">Interest is relative (100 = peak popularity among the compared terms). Source: Google Trends and Google Shopping via SerpApi.</p>`;
            document.getElementById('results').style.display = 'block';
        }

        document.getElementById('goBtn').addEventListener('click', async () => {
            if (selected.length < 2) return alert('Pick at least 2 ingredients to compare.');
            const btn = document.getElementById('goBtn');
            btn.disabled = true;
            btn.textContent = 'Reading Google Trends...';
            try {
                const res = await fetch('/api/trends', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ingredients: selected })
                });
                const d = await res.json();
                if (d.error) {
                    document.getElementById('results').style.display = 'block';
                    document.getElementById('results').innerHTML = `<div class="card"><p style="text-align:center; color:#D32F2F;">${esc(d.error)}</p></div>`;
                } else {
                    render(d);
                }
            } catch (e) {
                alert('Something went wrong. Please try again.');
            }
            btn.textContent = 'Show the pulse ✨';
            btn.disabled = false;
        });

        renderPills();
    </script>
</body>

</html>
